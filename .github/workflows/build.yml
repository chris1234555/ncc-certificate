name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (toolchain is pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      - name: Build NccCert and OpenAI's FourierCircuit
        run: lake build NccCert OAIFourier

      - name: Axiom check (only propext, Classical.choice, Quot.sound)
        run: ./scripts/check_axioms.sh

      - name: Kernel replay of every project module (leanchecker)
        run: ./check_all.sh

      - name: Vendored OpenAI files are identical to upstream
        run: ./scripts/verify_vendored.sh
